   <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menuzy | Cooking</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./assets/global.css">
  <link rel="stylesheet" href="./pages/home/hero/hero.css">
  <link rel="stylesheet" href="./components/popup/popup.css">
  <link rel="icon" href="../assets/images/logo.svg" type="image/x-icon">
</head>

<body>

  <div id="header-container"></div>

  <div id="hero-container"></div>
  <div id="home-menu-container"></div>
  <div id="about-container"></div>
  <div id="shop-container"></div>
  <div id="right-container"></div>
  <div id="testimonial-container"></div>
  <div id="homeBlogSection"></div>
  <div id="h-contact"></div>

  <div id="footer"></div>

  <div id="popup-container"></div>

<script>
fetch('/components/popup/popup.html')
  .then(res => res.text())
  .then(data => {
    const container = document.getElementById('popup-container');

    if (container) {
      container.innerHTML = data;
    }

    // ✅ LOAD CSS
    if (!document.querySelector('link[href="/components/popup/popup.css"]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "/components/popup/popup.css";
      document.head.appendChild(link);
    }

    // ✅ LOAD JS
    if (!document.querySelector('script[src="/components/popup/popup.js"]')) {
      const script = document.createElement("script");
      script.src = "/components/popup/popup.js";
      document.body.appendChild(script);
    }

    console.log("Popup Loaded");
  })
  .catch(err => console.error("Popup load error:", err));
</script>


  <script src="./assets/blog-data.js"></script>
  <script src="./assets/layout.js"></script>
  <script src="./assets/sectionLoader.js" defer></script>
  <script src="./pages/home/hero/hero.js" defer></script>
  <script src="./components/popup/popup.js" defer></script>
<script src="./pages/home/about/habout.js" defer></script>
<script src="/assets/cart.js"></script>
<script src="./assets/global.js"></script>

</body>

</html>
