
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="../../assets/global.css">
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="../../components/popup/popup.css">
    <link rel="icon" href="../../assets/images/logo.svg" type="image/x-icon">

</head>
<body>
<div id="header-container"></div>


<section class="contact-div">
  <div class="container contact-hero-section" id="contact-hero-section"></div>
</section>
  

<section class="contact2nddiv">
<div class="container cnt-2nd-section" id="cnt-2nd-section"></div>
</section>

<section id="third-section">
  <div class="container third-main-div" id="third-main-div"></div>
</section>

<div id="footer"></div>


<div id="popup-container"></div>

  <script>
fetch('../../components/popup/popup.html')
  .then(res => res.text())
  .then(data => {
    const container = document.getElementById('popup-container');

    if (container) {
      container.innerHTML = data;
    }

    //  LOAD CSS
    if (!document.querySelector('link[href="../../components/popup/popup.css"]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "../../components/popup/popup.css";
      document.head.appendChild(link);
    }

    //  LOAD JS
    if (!document.querySelector('script[src="../../components/popup/popup.js"]')) {
      const script = document.createElement("script");
      script.src = "../../components/popup/popup.js";
      document.body.appendChild(script);
    }

    console.log("Popup Loaded");
  })
  .catch(err => console.error("Popup load error:", err));
</script>

<script src="../../assets/sectionLoader.js"></script>
<script src="../../assets/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="contact.js"></script>
<script src="../../assets/global.js"></script>

</body>
</html>
