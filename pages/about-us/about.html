  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>About Us</title>
      <link rel="stylesheet" href="../../assets/global.css">
      <link rel="stylesheet" href="about.css">
      <link rel="stylesheet" href="../../components/popup/popup.css">
      <link rel="stylesheet" href="../home/testimonial/testimonial.css">
      <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />


  </head>
  <body>
      <div id="header-container"></div>

      <section class="about-hero">
          <div class="container about-maindiv" id="about-maindiv"></div>
      </section>
      
      <section class="about-first-section">
        <div class="container about-firstdiv">
          <div class="container about-left-img" id="about-left-img"></div>
          <div class="container about-right-text-div" id="about-right-text-div"></div>
        </div>
      </section> 

      <section class="about-secend-section">
        <div class="container about-secenddiv">
          <div class="container secend-textdiv" id="secend-textdiv"></div>
          <div class="container about-secend-griddiv" id="about-secend-griddiv"></div>
        </div>
      </section>

      <section>
        <div id="testimonial-section"></div>
      </section>

      <section class="hello-order-section">
        <div class="container hello-order-div" id="order-number-section">
          <div class="container order-text-left" id="order-number-left"></div>
          <div class="container order-image-right" id="order-image-right"></div>
        </div>
      </section>

      <div id="footer"></div>

  <div id="popup-container"></div>

    <script>
  fetch('../../components/popup/popup.html')
    .then(res => res.text())
    .then(data => {
      const container = document.getElementById('popup-container');

      if (container) {
        container.innerHTML = data;
      }

      //  LOAD CSS
      if (!document.querySelector('link[href="../../components/popup/popup.css"]')) {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "../../components/popup/popup.css";
        document.head.appendChild(link);
      }

      //  LOAD JS
      if (!document.querySelector('script[src="../../components/popup/popup.js"]')) {
        const script = document.createElement("script");
        script.src = "../../components/popup/popup.js";
        document.body.appendChild(script);
      }

      console.log("Popup Loaded");
    })
    .catch(err => console.error("Popup load error:", err));
      </script>
  <script src="../../assets/layout.js"></script>
  <script src="../../assets/sectionLoader.js"></script>
  <script src="about.js" defer></script>
  <!-- <script src="../about.js"></script> -->
  </body>
  </html>
