<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <link rel="stylesheet" href="../../assets/global.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="../../components/popup/popup.css">

</head>
<body>
    <div id="header-container"></div>

    <section class="about-hero">
        <div class="container about-maindiv" id="about-maindiv"></div>
    </section>

    <div id="footer"></div>

<div id="popup-container"></div>

  <script>
fetch('../../components/popup/popup.html')
  .then(res => res.text())
  .then(data => {
    const container = document.getElementById('popup-container');

    if (container) {
      container.innerHTML = data;
    }

    //  LOAD CSS
    if (!document.querySelector('link[href="../../components/popup/popup.css"]')) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "../../components/popup/popup.css";
      document.head.appendChild(link);
    }

    //  LOAD JS
    if (!document.querySelector('script[src="../../components/popup/popup.js"]')) {
      const script = document.createElement("script");
      script.src = "../../components/popup/popup.js";
      document.body.appendChild(script);
    }

    console.log("Popup Loaded");
  })
  .catch(err => console.error("Popup load error:", err));
    </script>
<script src="../../assets/layout.js"></script>
<script src="../../assets/sectionLoader.js"></script>
<script src="about.js" defer></script>
</body>
</html>
